<header class="header" [class.scrolled]="isScrolled" id="header">
  <nav class="nav container">
    <a routerLink="/" class="logo">
      <span class="logo-icon">
        <img src="/images/logo.png" alt="Abroado Logo" class="logo-img">
      </span>
    </a>

    <ul class="nav-links" id="nav-links">
      <li><a routerLink="/" class="nav-link" [class.active]="activeSection==='home'"
          (click)="scrollTo('home')">Home</a></li>
      <li><a routerLink="/about" class="nav-link" routerLinkActive="active">About</a></li>
      <li><a routerLink="/" class="nav-link" [class.active]="activeSection==='services'"
          (click)="scrollTo('services')">Services</a></li>
      <li><a routerLink="/" class="nav-link" [class.active]="activeSection==='destinations'"
          (click)="scrollTo('destinations')">Destinations</a></li>
      <li><a routerLink="/" class="nav-link" [class.active]="activeSection==='testimonials'"
          (click)="scrollTo('testimonials')">Success Stories</a></li>
      <li><a routerLink="/contact" class="nav-link" routerLinkActive="active">Contact</a></li>

      <li><a routerLink="/blog" class="nav-link" routerLinkActive="active">Blog</a></li>
    </ul>

    <a routerLink="/contact" class="btn btn-primary nav-cta">Free Consultation</a>

    <button class="mobile-menu-toggle" [class.active]="mobileOpen" (click)="toggleMobile()" aria-label="Toggle menu">
      <span></span><span></span><span></span>
    </button>
  </nav>

  <div class="progress-container">
    <div class="progress-bar" [style.width.%]="scrollProgress">
      <span class="airplane-icon"><img src="/images/airplane.png" alt="airplane"></span>
    </div>
  </div>
</header>

<!-- Mobile Menu -->
<div class="mobile-menu" [class.active]="mobileOpen" id="mobile-menu">
  <ul class="mobile-nav-links">
    <li><a routerLink="/" class="mobile-nav-link" (click)="closeMobile(); scrollTo('home')">Home</a>
    </li>
    <li><a routerLink="/about" class="mobile-nav-link" routerLinkActive="active" (click)="closeMobile()">About</a></li>
    <li><a routerLink="/" class="mobile-nav-link"
        (click)="closeMobile(); scrollTo('services')">Services</a></li>
    <li><a routerLink="/" class="mobile-nav-link"
        (click)="closeMobile(); scrollTo('destinations')">Destinations</a></li>
    <li><a routerLink="/" class="mobile-nav-link"
        (click)="closeMobile(); scrollTo('testimonials')">Success Stories</a></li>
    <li><a routerLink="/blog" class="mobile-nav-link" (click)="closeMobile()">Blog</a></li>
    <li><a routerLink="/contact" class="mobile-nav-link" routerLinkActive="active" (click)="closeMobile()">Contact</a></li>
  </ul>
  <a routerLink="/contact" class="btn btn-primary mobile-cta" (click)="closeMobile()">Free Consultation</a>
</div>
